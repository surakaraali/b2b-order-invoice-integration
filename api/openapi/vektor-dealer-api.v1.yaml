        updatedAt: '2027-03-05T09:14:52+03:00'
        history:
          - sequence: 1
            status: RECEIVED
            occurredAt: '2027-03-05T09:14:07+03:00'
          - sequence: 2
            previousStatus: RECEIVED
            status: APPROVED
            decidedBy: SYSTEM
            occurredAt: '2027-03-05T09:14:48+03:00'
          - sequence: 3
            previousStatus: APPROVED
            status: ALLOCATED
            occurredAt: '2027-03-05T09:14:52+03:00'
        links:
          self: /v1/orders/VO-2027-000123
    StockResponseExample:
      summary: Two known SKUs and one unknown
      value:
        asOf: '2027-03-05T09:10:00+03:00'
        items:
          - sku: '100234'
            status: OK
            unitCode: C62
            minimumOrderQuantity: 2
            warehouses:
              - warehouseCode: IST
                isShippingWarehouse: true
                sellableQuantity: 48
              - warehouseCode: ANK
                isShippingWarehouse: false
                sellableQuantity: 15
              - warehouseCode: IZM
                isShippingWarehouse: false
                sellableQuantity: 0
                expectedReceiptDate: '2027-03-12'
                expectedReceiptQuantity: 40
          - sku: '100235'
            status: OK
            unitCode: C62
            minimumOrderQuantity: 1
            warehouses:
              - warehouseCode: IST
                isShippingWarehouse: true
                sellableQuantity: 0
                expectedReceiptDate: '2027-03-08'
                expectedReceiptQuantity: 20
              - warehouseCode: ANK
                isShippingWarehouse: false
                sellableQuantity: 3
              - warehouseCode: IZM
                isShippingWarehouse: false
                sellableQuantity: 7
          - sku: '999999'
            status: UNKNOWN
    ProductListExample:
      summary: First page of the catalogue
      value:
        items:
          - sku: '100234'
            name: VX-55Q 55-inch 4K television
            brand: Vektör Home
            category: Television
            unitCode: C62
            minimumOrderQuantity: 2
            vatRate: 20
            status: ACTIVE
            price:
              unitPrice: 18450.00
              currency: TRY
              validFrom: '2027-01-01'
            updatedAt: '2027-02-20T08:00:00+03:00'
          - sku: '200117'
            name: VX-300 soundbar
            brand: Vektör Home
            category: Audio
            unitCode: C62
            minimumOrderQuantity: 4
            vatRate: 20
            status: ACTIVE
            price:
              unitPrice: 2890.00
              currency: TRY
              validFrom: '2027-01-01'
            updatedAt: '2027-02-20T08:00:00+03:00'
        nextPageToken: eyJvZmZzZXQiOjUwfQ
    InvoiceExample:
      summary: A delivered invoice
      value:
        ettn: 8f7a9c2e-1b3d-4e5f-9a6b-7c8d9e0f1a2b
        invoiceNo: VKT2027000001234
